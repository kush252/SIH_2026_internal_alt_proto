DATA:
  dataset_path: "d:/Kush/2nd Year/Hackathons/SIH/data/kaggle_svamitva/Svamitva/FilteredData"
  image_size: 512
  
  classes:
    background: [0, 0, 0]
    road: [255, 0, 0]


MODEL:
  output_stride: 16
  encoder:
    name: "resnet50"
    pretrained: false
    checkpoint_path: "d:/Kush/2nd Year/Hackathons/SIH_alt_archi/src/outputs/phase1_simsiam_encoder.pt"
  
  decoder:
    name: "deeplabv3plus"

AUGMENTATION:
  hflip_prob: 0.5
  vflip_prob: 0.5
  random_crop: true
  color_jitter: 0.1

TRAINING:
  epochs: 100
  batch_size: 8
  num_workers: 4
  use_amp: false
  clip_grad: 0.05
  accumulation_steps: 2

OPTIMIZER:
  encoder_lr: 1e-5
  decoder_lr: 1e-4
  head_lr: 1e-4
  weight_decay: 0.05
  warmup_epochs: 5

LOSS:
  weights:
    road: 1.0
  bce_weight: 0.2       # Drop this so it stops favoring the huge background
  dice_weight: 3.0      # Boost this massively to force it to connect thin roads!
  boundary_weight: 1.5  # Slightly boost this to keep road edges crisp


SYSTEM:
  seed: 42
  device: "cuda"
  output_dir: "outputs_phase2_road"
