DATA:
  svamitva_path: "d:/Kush/2nd Year/Hackathons/SIH/data/kaggle_svamitva/Svamitva/FilteredData"
  image_size: 512
  
  classes:
    background: [0, 0, 0]
    building: [255, 0, 0]
    road: [200, 255, 0]
    water: [0, 110, 255]

MODEL:
  encoder:
    name: "swin_tiny_patch4_window7_224"
    pretrained: false  # Will be loaded from Phase 1 checkpoint
    patch_size: 4
    window_size: 7
    embed_dim: 96
    depths: [2, 2, 6, 2]
    num_heads: [3, 6, 12, 24]
    checkpoint_path: "d:/Kush/2nd Year/Hackathons/SIH/src/outputs/swin_t_simmim_encoder.pt"
  
  decoder:
    hidden_dim: 256
    num_queries: 100
    nheads: 8
    dim_feedforward: 2048
    dec_layers: 6
    pre_norm: false
    enforce_input_project: false

AUGMENTATION:
  hflip_prob: 0.5
  vflip_prob: 0.5
  random_crop: true
  color_jitter: 0.1

TRAINING:
  epochs: 100
  batch_size: 8
  num_workers: 4
  use_amp: true
  clip_grad: 5.0
  accumulation_steps: 2

OPTIMIZER:
  encoder_lr: 1e-5
  decoder_lr: 1e-4
  head_lr: 1e-4
  weight_decay: 0.05
  warmup_epochs: 5

LOSS:
  weights:
    building: 1.0
    road: 1.0
    water: 1.0
  bce_weight: 5.0
  dice_weight: 5.0
  class_weight: 2.0
  no_object_weight: 0.1

SYSTEM:
  seed: 42
  device: "cuda"
  output_dir: "outputs_phase2"
